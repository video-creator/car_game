<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟器大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0f;
  overflow:hidden;
  font-family:'Microsoft YaHei',Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

.lobby{
  position:relative;z-index:10;
  text-align:center;
}
.title{
  font-size:38px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(135deg,#f093fb,#f5576c,#fda085,#f093fb);
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:titleShift 4s linear infinite;
  margin-bottom:8px;
}
.subtitle{
  color:rgba(255,255,255,.45);font-size:14px;letter-spacing:2px;
  margin-bottom:48px;
}
@keyframes titleShift{0%{background-position:0%}100%{background-position:300%}}

.cards{
  display:flex;gap:36px;justify-content:center;
  flex-wrap:wrap;
}
.card{
  width:280px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:36px 28px 32px;
  cursor:pointer;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),
             border-color .25s,
             box-shadow .25s;
  position:relative;
  overflow:hidden;
  text-decoration:none;
  display:block;
}
.card::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, var(--glow) 0%, transparent 70%);
  opacity:0;transition:opacity .3s;
}
.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 24px 60px var(--shadow);
  border-color:var(--accent);
}
.card:hover::before{opacity:1}
.card:active{transform:translateY(-5px) scale(1.01);}

.card-car  {--glow:rgba(240,147,251,.25);--shadow:rgba(240,147,251,.3);--accent:rgba(240,147,251,.6)}
.card-train{--glow:rgba(56,249,215,.25);--shadow:rgba(56,249,215,.3);--accent:rgba(56,249,215,.6)}

.card-icon{font-size:64px;margin-bottom:16px;display:block;filter:drop-shadow(0 0 20px var(--accent))}
.card-name{
  font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;
  margin-bottom:8px;
}
.card-desc{
  font-size:13px;color:rgba(255,255,255,.5);line-height:1.7;
}
.card-badge{
  display:inline-block;margin-top:14px;
  padding:4px 14px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:1px;
  background:var(--accent);color:#000;
}
.card-car  .card-badge{background:rgba(240,147,251,.8)}
.card-train .card-badge{background:rgba(56,249,215,.8)}

.footer{
  margin-top:44px;color:rgba(255,255,255,.2);font-size:12px;letter-spacing:1px;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="lobby">
  <div class="title">🎮 模拟器大厅</div>
  <div class="subtitle">SELECT YOUR SIMULATION MODE</div>

  <div class="cards">
    <a class="card card-car" href="./index.html">
      <span class="card-icon">🚗</span>
      <div class="card-name">城市车祸模拟器</div>
      <div class="card-desc">
        驾驶汽车穿越无限城市<br>
        与 NPC 车辆碰撞制造车祸<br>
        WASD 控制 · 第三/第一人称
      </div>
      <div class="card-badge">CLASSIC</div>
    </a>

    <a class="card card-train" href="./train.html">
      <span class="card-icon">🚂</span>
      <div class="card-name">火车碰撞模拟器</div>
      <div class="card-desc">
        控制火车在无限轨道上飞驰<br>
        变轨、追尾、脱轨着火<br>
        ↑↓←→ 控制 · 三种视角
      </div>
      <div class="card-badge">NEW</div>
    </a>
  </div>

  <div class="footer">点击卡片进入游戏 · 按 Esc 可返回此页面</div>
</div>

<script>
// 粒子背景
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize(){
  W = canvas.width  = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
window.addEventListener('resize', resize);

for(let i=0;i<120;i++){
  particles.push({
    x: Math.random()*2000-1000, y: Math.random()*1200-600,
    vx: (Math.random()-.5)*0.4, vy: (Math.random()-.5)*0.4,
    r: Math.random()*1.8+0.4,
    alpha: Math.random()*0.6+0.1,
    color: `hsl(${Math.random()*60+280},80%,70%)`
  });
}

function drawBg(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    if(p.x < -W/2-10) p.x = W/2+10;
    if(p.x >  W/2+10) p.x = -W/2-10;
    if(p.y < -H/2-10) p.y = H/2+10;
    if(p.y >  H/2+10) p.y = -H/2-10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
  });
  ctx.restore();
  requestAnimationFrame(drawBg);
}
drawBg();
</script>
</body>
</html>
