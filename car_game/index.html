<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>城市碰撞模拟器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;background:#111;font-family:'Segoe UI',sans-serif;}
  canvas{display:block;}

  /* ── HUD 覆盖层 ────────────────────────── */
  #hud{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:10;
  }

  /* 速度计（右下）*/
  #speedometer{
    position:absolute;bottom:28px;right:28px;
    background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.15);
    backdrop-filter:blur(6px);border-radius:16px;
    padding:12px 20px;display:flex;flex-direction:column;align-items:center;
    color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  #speed-num{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;}
  #speed-unit{font-size:12px;opacity:.7;margin-top:2px;}

  /* 损坏仪表（左下）*/
  #damage-hud{
    position:absolute;bottom:28px;left:28px;
    background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.15);
    backdrop-filter:blur(6px);border-radius:16px;
    padding:14px 18px;min-width:180px;color:#fff;
  }
  #damage-hud h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.65;margin-bottom:10px;}
  .dmg-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .dmg-label{font-size:11px;width:38px;opacity:.7;}
  .dmg-track{flex:1;height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;}
  .dmg-bar{height:100%;border-radius:4px;transition:width .2s,background .2s;}

  /* 统计（顶部居中）*/
  #stats{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(6px);border-radius:30px;
    padding:8px 24px;display:flex;gap:28px;align-items:center;
    color:#fff;font-size:13px;font-weight:600;
  }
  .stat{display:flex;align-items:center;gap:6px;}
  .stat-icon{font-size:15px;}
  .stat-val{color:#00ff88;}

  /* 操作按钮（右上）*/
  #buttons{
    position:absolute;top:18px;right:18px;
    display:flex;flex-direction:column;gap:8px;pointer-events:all;
  }
  .btn{
    background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.2);
    backdrop-filter:blur(6px);border-radius:10px;
    color:#fff;font-size:13px;font-weight:600;
    padding:9px 16px;cursor:pointer;text-align:center;
    transition:background .18s,border-color .18s;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .btn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);}
  .btn:active{background:rgba(255,255,255,.28);}

  /* 控制说明（左上）*/
  #controls-hint{
    position:absolute;top:18px;left:18px;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(5px);border-radius:12px;
    padding:12px 16px;color:#ccc;font-size:11.5px;line-height:1.7;
  }
  #controls-hint b{color:#fff;}
  #controls-hint .sView{color:#aef;}

  /* 方向盘（第一人称）*/
  #wheel-hud{
    position:absolute;bottom:24px;right:50%;transform:translateX(50%);
    display:none;
  }
  #wheel-hud.show{display:block;}

  /* 碰撞闪屏 */
  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:rgba(255,200,0,0);transition:background .08s;
  }
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <!-- 速度计 -->
  <div id="speedometer">
    <span id="speed-num">0</span>
    <span id="speed-unit">km/h</span>
  </div>

  <!-- 损坏仪表 -->
  <div id="damage-hud">
    <h3>车辆状态</h3>
    <div class="dmg-row">
      <span class="dmg-label">车身</span>
      <div class="dmg-track"><div class="dmg-bar" id="dmg-body"  style="width:100%"></div></div>
    </div>
    <div class="dmg-row">
      <span class="dmg-label">轮胎</span>
      <div class="dmg-track"><div class="dmg-bar" id="dmg-tire"  style="width:100%"></div></div>
    </div>
    <div class="dmg-row">
      <span class="dmg-label">引擎</span>
      <div class="dmg-track"><div class="dmg-bar" id="dmg-engine"style="width:100%"></div></div>
    </div>
  </div>

  <!-- 统计 -->
  <div id="stats">
    <div class="stat"><span class="stat-icon">💥</span>碰撞：<span class="stat-val" id="sCrash">0</span></div>
    <div class="stat"><span class="stat-icon">🚗</span>NPC：<span class="stat-val" id="sCars">0</span></div>
    <div class="stat"><span class="stat-icon">📷</span><span id="sView">第三人称</span></div>
  </div>

  <!-- 按钮 -->
  <div id="buttons">
    <div class="btn" id="btnView">切换视角 [V]</div>
    <div class="btn" id="btnCrash">触发事故 [F]</div>
    <div class="btn" id="btnSpawn">+4 辆 NPC</div>
    <div class="btn" id="btnReset">重置游戏</div>
  </div>

  <!-- 控制说明 -->
  <div id="controls-hint">
    <b>W/↑</b> 油门　　<b>S/↓</b> 刹车/倒车<br>
    <b>A/←</b> 左转　　<b>D/→</b> 右转<br>
    <b>空格</b> 手刹漂移　<b>V</b> 切换视角<br>
    <b>鼠标拖拽</b> 旋转镜头 &nbsp;<b>滚轮</b> 缩放
  </div>

  <!-- 方向盘 -->
  <div id="wheel-hud">
    <canvas id="wheel-canvas" width="120" height="120"></canvas>
  </div>
</div>

<!-- 碰撞闪屏 -->
<div id="flash"></div>

<!-- ═══ JS 模块 ═══════════════════════════════ -->
<script src="three.min.js"></script>

<!-- Pass 基类（ShaderPass/RenderPass/UnrealBloomPass 依赖，r134 主 bundle 不含）-->
<script>
(function(){
  THREE.Pass = class Pass {
    constructor() { this.enabled=true; this.needsSwap=true; this.clear=false; this.renderToScreen=false; }
    setSize(){}
    render(){ console.error('Pass: .render() must be implemented in derived pass.'); }
  };
})();
</script>

<!-- 后处理（可选，bloom 效果） -->
<script src="CopyShader.js"></script>
<script src="ShaderPass.js"></script>
<script src="LuminosityHighPassShader.js"></script>
<script src="RenderPass.js"></script>
<script src="UnrealBloomPass.js"></script>
<script src="EffectComposer.js"></script>

<!-- 游戏模块（顺序重要：scene → materials → vehicles → city → traffic → effects → npc → controls → hud） -->
<script src="js/scene.js"></script>
<script src="js/materials.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/city.js"></script>
<script src="js/traffic.js"></script>
<script src="js/effects.js"></script>
<script src="js/npc.js"></script>
<script src="js/controls.js?v=20260413"></script>
<script src="js/hud.js"></script>

<!-- 把需要从 HTML onclick 调用的函数显式挂到 window -->
<script>
  window.toggleCamMode    = () => toggleCamMode();
  window.triggerPlayerCrazy = () => triggerPlayerCrazy();
</script>

<!-- ── 主循环 & 初始化（入口，极小）──────── -->
<script>
'use strict';

// ── 按钮事件 ─────────────────────────────────
document.getElementById('btnView').onclick   = toggleCamMode;
document.getElementById('btnCrash').onclick  = () => {
  // 找到最近的 NPC 让其失控
  let nearest = null, minD = 9999;
  for (const v of npcs) {
    if (v.crashed || v.state === 'outofcontrol') continue;
    const d = Math.hypot(v.mesh.position.x - player.px, v.mesh.position.z - player.pz);
    if (d < minD) { minD = d; nearest = v; }
  }
  if (nearest) {
    nearest.state    = 'outofcontrol';
    nearest.outTimer = 8;
    nearest.speed    = nearest.baseSpeed * 3.5;
  }
  triggerPlayerCrazy();
};
document.getElementById('btnSpawn').onclick  = () => { for (let i = 0; i < 4; i++) spawnNPC(); };
document.getElementById('btnReset').onclick  = () => {
  for (const v of npcs) scene.remove(v.mesh);
  npcs.length = 0;
  activeParticles.forEach(p => scene.remove(p.mesh));
  activeParticles.length = 0;

  const startRoadZ = 0;
  const lo = ROAD_W / 2 - 3.5;
  player.px = -20; player.pz = startRoadZ - lo;
  player.heading = 0; player.speed = 0;
  player.lateralSpeed = 0; player.steer = 0;
  player.hp = 100; player.tireHP = 100; player.engineHP = 100;
  player.crashed = false; player.rollAngle = 0; player.crashTimer = 0;
  player.mesh.rotation.set(0, 0, 0);
  player.mesh.position.set(player.px, 0, player.pz);
  updateDamageHUD();
  crashCount = 0; document.getElementById('sCrash').textContent = '0';
  spawnInitialNPCs();
};

// ── 主循环 ────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateTL(dt * 1000);
  updatePlayer(dt);
  updateChunks(player.px, player.pz);
  updateNPCs(dt);
  checkPlayerCollisions();
  checkNPCCollisions();
  updateParticles();
  updateScatteredWheels();

  // 屏幕震动
  if (screenShakeTimer > 0) {
    screenShakeTimer -= dt;
    const s = screenShakeIntensity * (screenShakeTimer > 0 ? 1 : 0);
    camera.position.x += rnd(-s, s);
    camera.position.y += rnd(-s * 0.5, s * 0.5);
    camera.position.z += rnd(-s, s);
  }

  updateCamera(dt);
  updateSpeedHUD();

  // 自动补充 NPC
  if (npcs.filter(v => !v.crashed).length < 18 && Math.random() < 0.03) spawnNPC();

  renderer.render(scene, camera);
}

// ── 初始化 ────────────────────────────────────
try {
  buildCity();
  buildTrafficLights();

  player.mesh = buildPlayerCar();
  player.px   = 10;
  player.pz   = -(ROAD_W / 2 - 3.5);
  player.heading = 0;           // heading=0 时车头朝 +X（与模型一致）
  player.mesh.position.set(player.px, 0, player.pz);
  player.mesh.rotation.y = player.heading;
  scene.add(player.mesh);
  updateDamageHUD();

  spawnInitialNPCs();
  animate();
} catch (e) {
  document.body.innerHTML =
    '<div style="color:#f55;padding:40px;font-size:15px;font-family:monospace;white-space:pre">'
    + '❌ 启动失败:\n' + e.stack + '</div>';
}
</script>

</body>
</html>
