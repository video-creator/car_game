<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🚄 火车大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
canvas{display:block;}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#speed-box{
  position:absolute;bottom:24px;right:24px;
  background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);border-radius:18px;padding:14px 22px;
  color:#fff;text-align:center;min-width:100px;
}
#speed-num{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;color:#00ff88}
#speed-unit{font-size:11px;opacity:.7;margin-top:2px;letter-spacing:2px}

#score-box{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);border-radius:30px;padding:8px 28px;
  display:flex;gap:24px;align-items:center;color:#fff;font-size:14px;font-weight:600;
}
.score-item{display:flex;align-items:center;gap:6px}
.score-val{color:#00ff88}
.sv2{color:#ffcc00}

#hp-bar{
  position:absolute;bottom:24px;left:24px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);border-radius:12px;padding:12px 16px;color:#fff;min-width:150px;
}
#hp-bar .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;opacity:.65;margin-bottom:6px}
#hp-track{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#hp-fill{height:100%;border-radius:4px;transition:width .2s,background .2s;background:#00ff88}

#junction-box{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.65);border:2px solid rgba(255,200,0,.4);
  backdrop-filter:blur(6px);border-radius:14px;padding:10px 20px;
  color:#fff;font-size:13px;text-align:center;
  display:none;pointer-events:all;cursor:pointer;
}
#junction-box.show{display:block;animation:pulse 0.8s ease-in-out infinite alternate}
@keyframes pulse{100%{border-color:rgba(255,200,0,.8);transform:translateX(-50%) scale(1.04)}}
#junction-box .hint{color:#ffcc00;font-size:16px;font-weight:700}
#junction-box .sub{color:#aaa;font-size:11px;margin-top:2px}

#controls-hint{
  position:absolute;top:16px;left:16px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(5px);border-radius:10px;padding:8px 12px;
  color:#bbb;font-size:11px;line-height:1.8;
  transition:opacity .8s;
}
#controls-hint b{color:#fff}
#controls-hint .k{color:#00ff88}

#flash{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  background:rgba(255,200,0,0);transition:background .06s;
}

/* 游戏结束弹窗 */
#gameover{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(10px);
}
#gameover.show{display:flex}
#go-box{
  background:rgba(0,0,0,.8);border:2px solid rgba(255,255,255,.15);
  border-radius:24px;padding:40px 50px;text-align:center;color:#fff;
  max-width:400px;
}
#go-box h2{font-size:36px;margin-bottom:8px}
#go-box .sub{font-size:14px;color:#aaa;margin-bottom:24px}
#go-box .go-stat{font-size:18px;margin:6px 0}
#go-box .go-stat span{color:#00ff88;font-weight:900}
#go-btn{
  margin-top:24px;padding:14px 48px;border:none;border-radius:40px;
  background:linear-gradient(135deg,#00ff88,#00cc66);color:#000;
  font-size:18px;font-weight:800;cursor:pointer;pointer-events:all;
  transition:transform .15s;
}
#go-btn:hover{transform:scale(1.08)}
</style>
</head>
<body>

<div id="hud">
  <div id="score-box">
    <div class="score-item">⏱️ <span class="score-val" id="sDist">0</span>m</div>
    <div class="score-item">⭐ <span class="score-val sv2" id="sStar">0</span></div>
    <div class="score-item">💥 <span class="score-val" id="sCrash">0</span></div>
  </div>

  <div id="speed-box">
    <div id="speed-num">0</div>
    <div id="speed-unit">KM/H</div>
  </div>

  <div id="hp-bar">
    <div class="label">列车状态</div>
    <div id="hp-track"><div id="hp-fill" style="width:100%"></div></div>
  </div>

  <div id="junction-box">
    <div class="hint">← 左岔 / → 右岔</div>
    <div class="sub">按 A/D 或 ←/→ 选择轨道方向</div>
  </div>

  <div id="controls-hint">
    <b>W/↑</b> 加速 &nbsp; <b>S/↓</b> 刹车<br>
    <b>A/← D/→</b> 变轨 &nbsp; <b>V</b> 视角
  </div>
</div>

<div id="flash"></div>

<div id="gameover">
  <div id="go-box">
    <h2>🚄 脱轨了！</h2>
    <div class="sub">列车损毁严重，本次旅程结束</div>
    <div class="go-stat">🏁 行驶距离：<span id="goDist">0</span>m</div>
    <div class="go-stat">⭐ 收集星星：<span id="goStar">0</span></div>
    <div class="go-stat">💥 碰撞次数：<span id="goCrash">0</span></div>
    <button id="go-btn">🔄 再来一次</button>
  </div>
</div>


  <script src="./assets/train-game.js"></script>
</body>
</html>
